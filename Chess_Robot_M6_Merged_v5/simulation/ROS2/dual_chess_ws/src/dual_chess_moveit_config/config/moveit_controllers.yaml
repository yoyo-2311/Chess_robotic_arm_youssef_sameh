moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager
moveit_simple_controller_manager:
  controller_names:
  - robot1_controller
  - robot2_controller
  robot1_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
    - robot1_joint1
    - robot1_joint2
    - robot1_joint3
  robot2_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
    - robot2_joint1
    - robot2_joint2
    - robot2_joint3
